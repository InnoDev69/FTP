<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dahua FTP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">DAHUA</div>
    <h1 class="login-title">DAHUA<span class="accent">FTP</span></h1>
    <p class="login-subtitle">Sistema de gestion de videos</p>

    {% if error %}
    <div class="login-error" id="loginError">{{ error }}</div>
    {% else %}
    <div class="login-error" id="loginError" hidden></div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Usuario FTP</label>
        <input type="text" id="username" name="username"
               placeholder="usuario" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password"
               placeholder="********" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary btn-full" id="loginSubmit">Ingresar</button>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='js/ajax-loader.js') }}"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
