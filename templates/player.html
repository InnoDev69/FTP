{% extends "base.html" %}
{% block title %}Reproductor de Video{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-play"></i> Reproductor de Video</h3>
    </div>
    <div class="card-body" style="text-align:center;">
        <video width="80%" controls autoplay>
            <source src="{{ video_file }}" type="video/mp4">
            Tu navegador no soporta la reproducción de video.
        </video>
        <div style="margin-top:1rem;">
            <a href="{{ video_file }}" class="btn btn-primary" download>Descargar Video</a>
            <a href="{{ url_for('videos') }}" class="btn btn-secondary">Volver</a>
        </div>
    </div>
</div>
{% endblock %}
