{% extends "base.html" %}
{% block title %}Reproductor - Video{% endblock %}
{% block content %}
<div class="player-page">
    <div class="player-container">
        <div class="player-header">
            <h2><i class="fas fa-play-circle"></i> Reproductor de Video</h2>
            <div class="player-controls">
                <a href="{{ video_file }}" class="btn btn-secondary" download>
                    <i class="fas fa-download"></i> Descargar
                </a>
                <button onclick="toggleFullscreen()" class="btn btn-outline" id="fullscreenBtn">
                    <i class="fas fa-expand"></i> Pantalla Completa
                </button>
            </div>
        </div>
        
        <div class="video-wrapper" id="videoWrapper">
            <video 
                id="videoPlayer"
                width="100%" 
                height="100%"
                controls 
                autoplay
                preload="metadata"
                onloadedmetadata="onVideoLoaded()"
                onended="onVideoEnded()">
                <source src="{{ video_file }}" type="video/mp4">
                <p class="video-error">
                    Tu navegador no soporta la reproducción de video HTML5.
                    <a href="{{ video_file }}" download>Descargar el video</a>
                </p>
            </video>
            
            <div class="video-overlay" id="videoOverlay">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Cargando video...</p>
                </div>
            </div>
        </div>
        
        <div class="player-info">
            <div class="video-details">
                <h3 id="videoTitle">{{ video_file.split('/')[-1] }}</h3>
                <div class="video-meta">
                    <span id="videoDuration">--:--</span>
                    <span id="videoSize">Calculando...</span>
                    <span id="videoResolution">--x--</span>
                </div>
            </div>
            
            <div class="player-actions">
                <button onclick="restartVideo()" class="btn btn-outline btn-sm">
                    <i class="fas fa-redo"></i> Reiniciar
                </button>
                <button onclick="toggleMute()" class="btn btn-outline btn-sm" id="muteBtn">
                    <i class="fas fa-volume-up"></i> Silenciar
                </button>
                <button onclick="changeSpeed()" class="btn btn-outline btn-sm" id="speedBtn">
                    <i class="fas fa-tachometer-alt"></i> 1x
                </button>
            </div>
        </div>
    </div>
    
    <div class="navigation-section">
        <a href="javascript:history.back()" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
</div>

<style>
.player-page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0;
}

.player-container {
    background: rgba(26, 26, 26, 0.8);
    backdrop-filter: var(--blur-md);
    border: 1px solid var(--border-secondary);
    border-radius: var(--radius-xl);
    overflow: hidden;
    margin-bottom: 2rem;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem;
    border-bottom: 1px solid var(--border-subtle);
    background: rgba(17, 17, 17, 0.5);
}

.player-header h2 {
    margin: 0;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.player-header i {
    color: var(--accent-secondary);
}

.player-controls {
    display: flex;
    gap: 1rem;
}

.video-wrapper {
    position: relative;
    background: #000;
    min-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.video-wrapper.fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999;
    background: #000;
}

#videoPlayer {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 0;
    outline: none;
}

.video-wrapper.fullscreen #videoPlayer {
    width: 100vw;
    height: 100vh;
    max-height: none;
}

.video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
}

.video-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-spinner {
    text-align: center;
    color: var(--text-primary);
}

.loading-spinner i {
    font-size: 3rem;
    margin-bottom: 1rem;
    color: var(--accent-secondary);
}

.loading-spinner p {
    font-size: 1.1rem;
    margin: 0;
}

.video-error {
    color: var(--error);
    text-align: center;
    padding: 2rem;
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.2);
    border-radius: var(--radius-lg);
    margin: 2rem;
}

.video-error a {
    color: var(--error);
    text-decoration: underline;
}

.player-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 2rem;
    background: rgba(17, 17, 17, 0.3);
    border-top: 1px solid var(--border-subtle);
}

.video-details h3 {
    margin: 0 0 1rem 0;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 1.2rem;
    word-break: break-all;
}

.video-meta {
    display: flex;
    gap: 2rem;
    color: var(--text-muted);
    font-size: 0.9rem;
}

.video-meta span {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.video-meta span::before {
    content: "•";
    color: var(--accent-muted);
    font-weight: bold;
}

.video-meta span:first-child::before {
    display: none;
}

.player-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
}

.navigation-section {
    display: flex;
    justify-content: center;
    padding: 1rem 0;
}

/* Estados de velocidad */
.speed-05x { color: var(--warning) !important; }
.speed-1x { color: var(--text-primary) !important; }
.speed-125x { color: var(--info) !important; }
.speed-15x { color: var(--success) !important; }
.speed-2x { color: var(--error) !important; }

@media (max-width: 768px) {
    .player-header {
        flex-direction: column;
        gap: 1.5rem;
        align-items: flex-start;
    }
    
    .player-controls {
        width: 100%;
        justify-content: flex-start;
    }
    
    .player-info {
        flex-direction: column;
        gap: 1.5rem;
    }
    
    .video-meta {
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .player-actions {
        width: 100%;
        justify-content: center;
    }
    
    #videoPlayer {
        max-height: 50vh;
    }
}

@media (max-width: 480px) {
    .player-container {
        margin: 0 -1rem;
        border-radius: 0;
        border-left: none;
        border-right: none;
    }
    
    .player-header,
    .player-info {
        padding: 1.5rem;
    }
    
    .player-controls,
    .player-actions {
        flex-direction: column;
    }
}
</style>

<script>
let currentSpeed = 1;
const speeds = [0.5, 1, 1.25, 1.5, 2];
let speedIndex = 1;

function onVideoLoaded() {
    const video = document.getElementById('videoPlayer');
    const overlay = document.getElementById('videoOverlay');
    
    // Ocultar overlay de carga
    overlay.classList.add('hidden');
    
    // Actualizar información del video
    updateVideoInfo();
}

function onVideoEnded() {
    showNotification('Video terminado', 'info');
}

function updateVideoInfo() {
    const video = document.getElementById('videoPlayer');
    
    // Duración
    if (video.duration) {
        const duration = formatTime(video.duration);
        document.getElementById('videoDuration').textContent = duration;
    }
    
    // Resolución
    if (video.videoWidth && video.videoHeight) {
        document.getElementById('videoResolution').textContent = 
            `${video.videoWidth}x${video.videoHeight}`;
    }
    
    // Tamaño del archivo (estimado)
    if (video.duration) {
        // Estimación muy básica basada en duración
        const estimatedSize = Math.round(video.duration * 0.5); // ~0.5MB por minuto
        document.getElementById('videoSize').textContent = `~${estimatedSize} MB`;
    }
}

function formatTime(seconds) {
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    
    if (hours > 0) {
        return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    } else {
        return `${minutes}:${secs.toString().padStart(2, '0')}`;
    }
}

function toggleFullscreen() {
    const wrapper = document.getElementById('videoWrapper');
    const video = document.getElementById('videoPlayer');
    const btn = document.getElementById('fullscreenBtn');
    
    if (!document.fullscreenElement) {
        wrapper.requestFullscreen().then(() => {
            wrapper.classList.add('fullscreen');
            btn.innerHTML = '<i class="fas fa-compress"></i> Salir Pantalla Completa';
        }).catch(err => {
            console.error('Error al entrar en pantalla completa:', err);
        });
    } else {
        document.exitFullscreen().then(() => {
            wrapper.classList.remove('fullscreen');
            btn.innerHTML = '<i class="fas fa-expand"></i> Pantalla Completa';
        });
    }
}

function restartVideo() {
    const video = document.getElementById('videoPlayer');
    video.currentTime = 0;
    video.play();
    showNotification('Video reiniciado', 'info');
}

function toggleMute() {
    const video = document.getElementById('videoPlayer');
    const btn = document.getElementById('muteBtn');
    
    video.muted = !video.muted;
    
    if (video.muted) {
        btn.innerHTML = '<i class="fas fa-volume-mute"></i> Activar Audio';
        showNotification('Audio silenciado', 'info');
    } else {
        btn.innerHTML = '<i class="fas fa-volume-up"></i> Silenciar';
        showNotification('Audio activado', 'info');
    }
}

function changeSpeed() {
    const video = document.getElementById('videoPlayer');
    const btn = document.getElementById('speedBtn');
    
    speedIndex = (speedIndex + 1) % speeds.length;
    currentSpeed = speeds[speedIndex];
    video.playbackRate = currentSpeed;
    
    // Actualizar botón con clase de color
    btn.className = `btn btn-outline btn-sm speed-${currentSpeed.toString().replace('.', '')}x`;
    btn.innerHTML = `<i class="fas fa-tachometer-alt"></i> ${currentSpeed}x`;
    
    showNotification(`Velocidad: ${currentSpeed}x`, 'info');
}

function showNotification(message, type) {
    const notification = document.createElement('div');
    notification.className = `alert alert-${type}`;
    notification.textContent = message;
    notification.style.position = 'fixed';
    notification.style.top = '20px';
    notification.style.right = '20px';
    notification.style.zIndex = '10000';
    notification.style.minWidth = '200px';
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.style.opacity = '0';
        setTimeout(() => {
            notification.remove();
        }, 300);
    }, 2000);
}

// Escuchar cambios de pantalla completa
document.addEventListener('fullscreenchange', function() {
    const wrapper = document.getElementById('videoWrapper');
    const btn = document.getElementById('fullscreenBtn');
    
    if (!document.fullscreenElement) {
        wrapper.classList.remove('fullscreen');
        btn.innerHTML = '<i class="fas fa-expand"></i> Pantalla Completa';
    }
});

// Atajos de teclado
document.addEventListener('keydown', function(e) {
    const video = document.getElementById('videoPlayer');
    
    if (document.activeElement.tagName === 'INPUT') return;
    
    switch(e.key) {
        case ' ':
            e.preventDefault();
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
            break;
        case 'f':
        case 'F':
            toggleFullscreen();
            break;
        case 'm':
        case 'M':
            toggleMute();
            break;
        case 'r':
        case 'R':
            restartVideo();
            break;
        case 'ArrowLeft':
            video.currentTime -= 10;
            break;
        case 'ArrowRight':
            video.currentTime += 10;
            break;
        case 'ArrowUp':
            e.preventDefault();
            video.volume = Math.min(1, video.volume + 0.1);
            break;
        case 'ArrowDown':
            e.preventDefault();
            video.volume = Math.max(0, video.volume - 0.1);
            break;
    }
});

// Mostrar controles de teclado al cargar
window.addEventListener('load', function() {
    setTimeout(() => {
        showNotification('Usa ESPACIO para pausar/reproducir, F para pantalla completa', 'info');
    }, 1000);
});
</script>
{% endblock %}
