{% extends "base.html" %}
{% block title %}Videos - Dahua FTP{% endblock %}

{% block content %}
<div class="page-header">
  <h2 class="page-title">Videos</h2>
  <span class="page-sub" id="video-count">Cargando…</span>
</div>

<!-- Filtros -->
<div class="filters-bar">
  <select id="f-device" class="filter-select">
    <option value="">Todos los dispositivos</option>
    {% for d in filters.devices %}
    <option value="{{ d }}">{{ d }}</option>
    {% endfor %}
  </select>

  <select id="f-channel" class="filter-select">
    <option value="">Todos los canales</option>
    {% for c in filters.channels %}
    <option value="{{ c }}">{{ c }}</option>
    {% endfor %}
  </select>

  <select id="f-resolution" class="filter-select">
    <option value="">Todas las resoluciones</option>
    {% for r in filters.resolutions %}
    <option value="{{ r }}">{{ r }}</option>
    {% endfor %}
  </select>

  <input type="date" id="f-date" placeholder="Fecha">

  <button class="btn-secondary" id="btn-clear">Limpiar</button>
</div>

<!-- Grid de videos -->
<div id="video-grid" class="video-grid">
  <div class="loading-msg">Cargando videos…</div>
</div>

<!-- Acciones en lote (Shift+click para seleccionar) -->
<div class="bulk-actions" id="bulk-actions" style="display:none">
  <span id="selected-count">0 seleccionados</span>
  <button class="btn-danger" id="btn-delete">Eliminar seleccionados</button>
</div>

<!-- ══════════════════════════════════════════════════════════════
     Panel de reproductores - hasta 6 slots simultaneos
     Oculto hasta que se abra el primer video.
     ══════════════════════════════════════════════════════════════ -->
<div id="player-panel" class="player-panel" hidden>

  <div class="player-panel__header">
    <span class="player-panel__title">
      <span class="accent">▶</span> Reproductores
    </span>
    <span class="player-panel__hint">Click en una card para abrir · Shift+click para seleccionar</span>
    <button
      class="btn-secondary player-panel__close-all"
      onclick="for(let i=0;i<6;i++) PlayerManager.closeSlot(i)"
    >Cerrar todos</button>
  </div>

  <!-- Grid 3×2 de slots -->
  <div class="player-grid">
    <div id="player-slot-0" class="player-slot player-slot--empty"></div>
    <div id="player-slot-1" class="player-slot player-slot--empty"></div>
    <div id="player-slot-2" class="player-slot player-slot--empty"></div>
    <div id="player-slot-3" class="player-slot player-slot--empty"></div>
    <div id="player-slot-4" class="player-slot player-slot--empty"></div>
    <div id="player-slot-5" class="player-slot player-slot--empty"></div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/video-player.js') }}"></script>
<script src="{{ url_for('static', filename='js/video-grid.js') }}"></script>
{% endblock %}
