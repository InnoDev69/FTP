<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuracion - Dahua FTP</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <style>
    .settings-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .setting-card {
      background: linear-gradient(135deg, #111 0%, #0a0a0a 100%);
      border: 1px solid #222;
      border-radius: 8px;
      padding: 20px;
    }

    .setting-card h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #0f9eff;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(34, 34, 34, 0.5);
    }

    .setting-item:last-child {
      border-bottom: none;
    }

    .setting-label {
      font-size: 13px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .setting-value {
      font-size: 13px;
      color: #999;
      font-family: monospace;
    }

    .setting-value input,
    .setting-value select {
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #2e2e2e;
      color: #e0e0e0;
      border-radius: 4px;
      font-size: 12px;
    }

    .setting-value input:focus,
    .setting-value select:focus {
      outline: none;
      border-color: #0f9eff;
      box-shadow: 0 0 0 2px rgba(15, 158, 255, 0.1);
    }

    .settings-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #2e2e2e;
    }

    .btn-apply {
      flex: 1;
      padding: 8px 12px;
      background: #0f9eff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-apply:hover {
      background: #1ab8ff;
    }

    .device-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .device-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .device-info {
      flex: 1;
    }

    .device-ip {
      font-family: monospace;
      color: #0f9eff;
    }

    .device-alias {
      color: #e0e0e0;
      font-weight: 600;
    }

    .device-location {
      color: #999;
      font-size: 11px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .page-actions {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover {
      background: rgba(15, 158, 255, 0.1);
      border-color: #0f9eff;
      color: #0f9eff;
    }

    #alerts-container {
      margin-bottom: 20px;
    }
  </style>
</head>
<body style="background: #0a0a0a; color: #e0e0e0;">

<div class="settings-container">
  <div class="page-header">
    <h1>Configuracion</h1>
    <div class="page-actions">
      <button class="btn-secondary" onclick="location.href='/'">← Volver</button>
      <button class="btn-secondary" onclick="resetSettings()">🔄 Restablecer</button>
    </div>
  </div>

  <div id="alerts-container"></div>

  <div class="settings-grid">
    <!-- SERVER SETTINGS -->
    <div class="setting-card">
      <h3>Servidor</h3>
      <div class="setting-item">
        <span class="setting-label">Host</span>
        <div class="setting-value">
          <input type="text" id="server-host" placeholder="0.0.0.0">
        </div>
      </div>
      <div class="setting-item">
        <span class="setting-label">Puerto</span>
        <div class="setting-value">
          <input type="number" id="server-port" placeholder="5000" min="1" max="65535">
        </div>
      </div>
      <div class="setting-item">
        <span class="setting-label">Debug</span>
        <div class="setting-value">
          <input type="checkbox" id="server-debug">
        </div>
      </div>
      <div class="setting-item">
        <span class="setting-label">Max Upload (GB)</span>
        <div class="setting-value">
          <input type="number" id="server-max-upload" placeholder="4" min="1">
        </div>
      </div>
      <div class="settings-actions">
        <button class="btn-apply" onclick="saveSetting('server')">Guardar</button>
      </div>
    </div>

    <!-- STORAGE SETTINGS -->
    <div class="setting-card">
      <h3>Almacenamiento</h3>
      <div class="setting-item">
        <span class="setting-label">Carpeta Videos</span>
        <div class="setting-value">
          <input type="text" id="storage-videos-dir" placeholder="dahua_videos">
        </div>
      </div>
      <div class="setting-item">
        <span class="setting-label">Carpeta Caché</span>
        <div class="setting-value">
          <input type="text" id="storage-cache-dir" placeholder="cache">
        </div>
      </div>
      <div class="setting-item">
        <span class="setting-label">Extensiones</span>
        <div class="setting-value">
          <input type="text" id="storage-extensions" placeholder=".dav, .mp4, .avi, .mkv">
        </div>
      </div>
      <div class="settings-actions">
        <button class="btn-apply" onclick="saveSetting('storage')">Guardar</button>
      </div>
    </div>

    <!-- HLS SETTINGS -->
    <div class="setting-card">
      <h3>HLS / Streaming</h3>
      <div class="setting-item">
        <span class="setting-label">Duración Segmento (seg)</span>
        <div class="setting-value">
          <input type="number" id="hls-segment-duration" placeholder="3600" min="1">
        </div>
      </div>
      <div class="settings-actions">
        <button class="btn-apply" onclick="saveSetting('hls')">Guardar</button>
      </div>
    </div>

    <!-- DEVICES SETTINGS -->
    <div class="setting-card">
      <h3>Dispositivos ({{ devices | length }})</h3>
      <div class="device-list" id="devices-list">
        <div style="color: #999; font-size: 12px; padding: 10px; text-align: center;">
          Cargando dispositivos...
        </div>
      </div>
      <div class="settings-actions">
        <button class="btn-apply" onclick="reloadDevices()">🔄 Recargar</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="{{ url_for('static', filename='js/ui-components.js') }}"></script>
<script src="{{ url_for('static', filename='js/ajax-loader.js') }}"></script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Cargar configuración actual
// ─────────────────────────────────────────────────────────────────────────────
async function loadSettings() {
  try {
    const resp = await AjaxManager.get('/api/config/current');
    if (!resp.ok) throw new Error(resp.error);

    const cfg = resp.config;

    // Llenar SERVER
    document.getElementById('server-host').value = cfg.server?.host || '0.0.0.0';
    document.getElementById('server-port').value = cfg.server?.port || 5000;
    document.getElementById('server-debug').checked = cfg.server?.debug || false;
    document.getElementById('server-max-upload').value = cfg.server?.max_upload_gb || 4;

    // Llenar STORAGE
    document.getElementById('storage-videos-dir').value = cfg.storage?.videos_dir || 'dahua_videos';
    document.getElementById('storage-cache-dir').value = cfg.storage?.cache_dir || 'cache';
    const exts = cfg.storage?.allowed_extensions?.join(', ') || '.dav, .mp4, .avi, .mkv';
    document.getElementById('storage-extensions').value = exts;

    // Llenar HLS
    document.getElementById('hls-segment-duration').value = cfg.hls?.segment_duration || 3600;

    // Llenar DEVICES
    renderDevices(cfg.devices);
  } catch (err) {
    showAlert('error', `Error cargando configuración: ${err.message}`);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Renderizar dispositivos
// ─────────────────────────────────────────────────────────────────────────────
function renderDevices(devices) {
  const el = document.getElementById('devices-list');
  const devs = Object.entries(devices || {});

  if (devs.length === 0) {
    el.innerHTML = '<div style="color: #999; font-size: 12px; padding: 10px; text-align: center;">Sin dispositivos registrados</div>';
    return;
  }

  let html = '';
  for (const [ip, info] of devs) {
    html += `
      <div class="device-item">
        <div class="device-info">
          <div class="device-ip">${escHTML(ip)}</div>
          <div class="device-alias">${escHTML(info.alias || ip)}</div>
          <div class="device-location">${escHTML(info.location || '-')}</div>
        </div>
      </div>
    `;
  }
  el.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────────────────────
// Guardar configuración
// ─────────────────────────────────────────────────────────────────────────────
async function saveSetting(section) {
  try {
    let data = {};

    if (section === 'server') {
      data = {
        host: document.getElementById('server-host').value,
        port: parseInt(document.getElementById('server-port').value),
        debug: document.getElementById('server-debug').checked,
        max_upload_gb: parseInt(document.getElementById('server-max-upload').value),
      };
    } else if (section === 'storage') {
      const exts = document.getElementById('storage-extensions').value
        .split(',')
        .map(e => e.trim())
        .filter(e => e);
      data = {
        videos_dir: document.getElementById('storage-videos-dir').value,
        cache_dir: document.getElementById('storage-cache-dir').value,
        allowed_extensions: exts,
      };
    } else if (section === 'hls') {
      data = {
        segment_duration: parseInt(document.getElementById('hls-segment-duration').value),
      };
    }

    const resp = await AjaxManager.post('/api/config/update', {
      section,
      data,
    });

    if (resp.ok) {
      showAlert('success', `${section.toUpperCase()} actualizado correctamente`);
    }
  } catch (err) {
    showAlert('error', `Error guardando ${section}: ${err.message}`);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────────
function showAlert(type, msg) {
  const el = document.getElementById('alerts-container');
  const alert = new AlertComponent(type, msg);
  const tempDiv = document.createElement('div');
  el.appendChild(tempDiv);
  alert.container = tempDiv;
  alert.show(5000);
}

function reloadDevices() {
  loadSettings();
  showAlert('info', 'Dispositivos recargados');
}

function resetSettings() {
  if (confirm('¿Restablecer configuración predeterminada? Esta acción no se puede deshacer.')) {
    showAlert('warning', 'Función no implementada aún');
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Inicialización
// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', loadSettings);
</script>
</body>
</html>
